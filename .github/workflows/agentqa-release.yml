# Builds the Windows installer, then installs-free smoke-tests the bundle on Windows with the full demo.
# Run it by hand (Actions > AgentQA release > Run workflow) or push a tag such as v1.0.0.
# The engine and installer live in backend/ (mono-repo since M0.1).
name: AgentQA release
on:
  workflow_dispatch:
    inputs:
      with_zap: {description: "Bundle OWASP ZAP and Java (about 250 MB more)", type: boolean, default: true}
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: backend

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the bundle and the installer
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ github.event_name }}" -eq "push" -or "${{ inputs.with_zap }}" -eq "true") { $extra += "-WithZap" }
          & powershell -ExecutionPolicy Bypass -File installer\build_installer.ps1 @extra
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test the bundle on Windows (full demo pipeline, every seeded bug)
        shell: cmd
        run: |
          set AGENTQA_DATA=%RUNNER_TEMP%\aq
          start "portal" /b build\AgentQA\agentqa.cmd demo-portal --port 8800
          powershell -Command "for ($i=0; $i -lt 60; $i++) { try { Invoke-WebRequest http://127.0.0.1:8800/ -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }"
          call build\AgentQA\agentqa.cmd demo-project %RUNNER_TEMP%\aq\projects\demo || exit /b 1
          call build\AgentQA\agentqa.cmd pipeline -p %RUNNER_TEMP%\aq\projects\demo --policy srs_wins --auto-approve || exit /b 1
          build\AgentQA\python\python.exe tools\check_demo.py %RUNNER_TEMP%\aq\projects\demo
      - uses: actions/upload-artifact@v4
        with: {name: AgentQA-Studio-Setup, path: backend/dist/*.exe}
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "${{ github.ref_name }}" dist/*.exe --title "AgentQA Studio ${{ github.ref_name }}" --generate-notes
