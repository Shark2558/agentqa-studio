# AgentQA Studio in GitHub Actions: copy to .github/workflows/agentqa.yml in the repository that holds
# your AgentQA project folder (projects/<name> with project.yaml, tests/ and .agentqa/ committed or restored).
# The plan must already be approved in the dashboard; CI never approves it.
name: AgentQA
on:
  workflow_dispatch:
  schedule: [{cron: "30 1 * * *"}]        # nightly, 07:00 IST
jobs:
  test:
    runs-on: ubuntu-latest                 # use a self-hosted runner inside your network for UAT portals
    timeout-minutes: 60
    env:
      AGENTQA_PW_CITIZEN: ${{ secrets.AGENTQA_PW_CITIZEN }}   # one secret per role password_env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m agentqa ci -p projects/my-portal --fail-on High --min-score 70
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentqa-report
          path: |
            projects/my-portal/reports/
            projects/my-portal/runs/*/junit.xml
